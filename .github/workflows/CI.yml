name: CI
# Cost-disciplined (house rule): PR + manual only, Linux only. Add macOS/Windows and a `push`
# trigger to `main` only right before a tagged release. Local checks come first:
#   julia --project=. -e 'using Pkg; Pkg.test()'
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          # The integration + bad-code suites spawn worker processes; run them here on purpose so a
          # regression in the sandbox kill path fails loudly (docs/design/01-architecture.md §2).
          JULIATIME_INTEGRATION: "1"
